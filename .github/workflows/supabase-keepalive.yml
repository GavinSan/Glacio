name: Keep Supabase awake

# Supabase pauses Free-plan projects after about 7 days without activity.
# This runs a tiny database query every 3 days so the project stays awake.
on:
  schedule:
    - cron: "17 14 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: https://dcuteqqnwlideecydtfn.supabase.co
          # Publishable key: public by design (it is also in index.html). Row-level security protects the data.
          SUPABASE_KEY: sb_publishable_DbdGIimTKvpNHjgtXy4U6Q_8y_kpWub
        run: |
          code=$(curl -sS -o out.txt -w '%{http_code}' -X POST "$SUPABASE_URL/rest/v1/rpc/glacio_ping" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}')
          echo "Response: $(cat out.txt)"
          echo "HTTP $code"
          test "$code" = "200"
