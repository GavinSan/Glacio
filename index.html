<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Glacio</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A0C0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>(function(){var p="dark";try{p=localStorage.getItem("glacio-theme")||"dark"}catch(e){}
var l=p==="light"||(p==="system"&&matchMedia("(prefers-color-scheme: light)").matches);document.documentElement.dataset.theme=l?"light":"dark";
if(l){document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content="default";document.querySelector('meta[name="theme-color"]').content="#F3F5F8"}})()</script>
<meta name="apple-mobile-web-app-title" content="Glacio">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone canvas centred on an ink stage; full-bleed on real phones.
   Palette rule from the brief: ~70% ink, ~25% paper, ~5% ice (controls, pressed state, motion). */
:root{
  --ink:#0A0C0F; --ink-2:#111419; --ink-3:#181C22; --ink-4:#222831; --line:#262C35;
  --paper:#F3F5F7; --paper-2:#C5CCD4; --mute:#8A939F; --dim:#5B6470;
  --ice:#5CC8FF; --ice-ink:#021625; --ice-soft:rgba(92,200,255,.16); --ice-glow:rgba(92,200,255,.55);
  --warn:#FFC98A; --danger:#E5484D; --stage:#141a22; --hero-mid:#E8F7FF;
  --f:"Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:dark;
}
html[data-theme="light"]{--ink:#F3F5F8;--ink-2:#FFFFFF;--ink-3:#ECEFF3;--ink-4:#DDE2E8;--line:#E3E7EC;--paper:#0C0F13;--paper-2:#3A424C;--mute:#646D79;--dim:#8C95A0;--ice:#0A86D2;--ice-ink:#FFFFFF;--ice-soft:rgba(10,134,210,.12);--ice-glow:rgba(10,134,210,.30);--stage:#E6EBF1;--hero-mid:#063F66;color-scheme:light}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--f);font-size:15px;-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.fit{white-space:nowrap;overflow:hidden;min-width:0}
i[data-lucide],svg.lucide{width:20px;height:20px;flex:none}

.stage{height:100%;display:flex;align-items:center;justify-content:center;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(120% 80% at 50% 0%, var(--stage) 0%, var(--ink) 60%)}
.device{position:relative;width:390px;height:min(844px,100%);background:var(--ink);border-radius:46px;border:1px solid var(--line);overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.6), inset 0 0 0 6px #050607}
.statusbar{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:space-between;padding:6px 32px 0;font-weight:700;font-size:14px;z-index:5}
.statusbar .sb{display:flex;gap:6px;align-items:center}
.statusbar .sb i,.statusbar .sb svg{width:16px;height:16px}
.screen{position:absolute;top:46px;left:0;right:0;bottom:82px;overflow-y:auto;overflow-x:hidden;padding-block:6px 28px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
@media (max-width:520px){
  .stage{padding:0}
  .device{width:100%;height:100%;border-radius:0;border:0;box-shadow:none}
  .statusbar{display:none}
  .screen{top:env(safe-area-inset-top,0px);bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .tabbar{height:calc(64px + env(safe-area-inset-bottom,0px))}
  .sheet{padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));--pb:calc(22px + env(safe-area-inset-bottom,0px))}
  .toast{top:calc(env(safe-area-inset-top,0px) + 10px)}
}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:82px;display:grid;grid-template-columns:repeat(5,1fr);align-items:start;padding-top:10px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));background:linear-gradient(to top, var(--ink) 70%, transparent);border-top:1px solid var(--line);z-index:4}
.tab{height:46px;display:grid;place-items:center;color:var(--dim);transition:color .2s}
.tab[aria-current="page"]{color:var(--ice)}
.tab i,.tab svg{width:24px;height:24px}
.tab .dot{width:4px;height:4px;border-radius:2px;background:var(--ice);margin-top:-6px;opacity:0;transition:opacity .2s}
.tab[aria-current="page"] .dot{opacity:1}
.tab-add{width:52px;height:52px;margin:-4px auto 0;border-radius:18px;background:var(--ice);color:var(--ice-ink);display:grid;place-items:center;transition:transform .15s}
.tab-add:active{transform:scale(.92)}
.tab-add i,.tab-add svg{width:26px;height:26px}

/* common */
.top{display:flex;align-items:center;gap:10px;height:48px;margin-bottom:6px}
.top h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0;flex:1;white-space:nowrap}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--ink-3);color:var(--paper);flex:none;transition:background .15s, transform .15s}
.icon-btn:active{transform:scale(.93);background:var(--ink-4)}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:15px;background:var(--ink-3);color:var(--paper-2);font-size:12.5px;font-weight:700;white-space:nowrap;flex:none}
.chip i,.chip svg{width:15px;height:15px}
.chip.ice{background:var(--ice-soft);color:var(--ice)}
.chip.on{background:var(--ice);color:var(--ice-ink)}
.label{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.sec{margin-top:22px;display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.list{background:var(--ink-2);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;min-height:54px;padding:0 12px;border-top:1px solid var(--line);width:100%;text-align:left;white-space:nowrap}
.row:first-child{border-top:0}
button.row{transition:background .15s}
button.row:active{background:var(--ink-3)}
.ic{width:34px;height:34px;border-radius:11px;background:var(--ink-3);display:grid;place-items:center;color:var(--paper-2);flex:none}
.ic i,.ic svg{width:18px;height:18px}
.ic.ice{background:var(--ice-soft);color:var(--ice)}
.grow{flex:1;min-width:0;font-weight:600}
.amt{font-weight:700;text-align:right;min-width:62px;font-variant-numeric:tabular-nums;flex:none}
.mute{color:var(--mute)}
.small{font-size:12.5px}
.w-date{width:44px;text-align:right;flex:none;font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.wal{color:var(--ice);display:grid;place-items:center;flex:none}
.wal i,.wal svg{width:14px;height:14px}
.btn{height:52px;border-radius:16px;background:var(--ice);color:var(--ice-ink);font-weight:800;font-size:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s, filter .15s;white-space:nowrap}
.btn:active{transform:scale(.98);filter:brightness(.92)}
.btn.ghost{background:var(--ink-3);color:var(--paper)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--ink-3);border-radius:13px;padding:3px;gap:3px}
.seg button{height:36px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--mute);white-space:nowrap;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--ice);color:var(--ice-ink);box-shadow:0 0 18px -4px var(--ice-glow)}
.seg button{display:flex;align-items:center;justify-content:center;gap:6px}.seg button svg{width:16px;height:16px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips .chip{transition:background .2s,color .2s}

/* donut */
.donut-wrap{display:grid;place-items:center;margin:8px 0 4px;position:relative}
.donut{position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.donut svg{transform:rotate(-90deg);display:block;overflow:visible}
.arc{animation:draw .3s cubic-bezier(.2,.8,.2,1);transition:stroke .25s, stroke-width .3s;cursor:pointer}
@keyframes draw{from{stroke-dasharray:0 var(--c)}}

.arc.holding{stroke-width:32px;transition:stroke-width .45s}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;padding:0 34px;text-align:center}
.dc-sub{font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.dc-main{font-size:32px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;max-width:100%;white-space:nowrap}
.dc-foot{font-size:12.5px;font-weight:600;color:var(--paper-2);white-space:nowrap}
.hint{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--mute);font-size:12.5px;font-weight:600;white-space:nowrap;margin-top:6px}
.hint i,.hint svg{width:15px;height:15px}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.leg{background:var(--ink-2);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;text-align:left;transition:background .15s, box-shadow .2s}
.leg:active{background:var(--ink-3)}
.leg.sel{box-shadow:inset 0 0 0 1.5px var(--ice)}
.leg .lt{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--mute);white-space:nowrap}
.leg .lv{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.pct{width:42px;text-align:right;flex:none;font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.cnt{width:28px;text-align:right;flex:none;font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}

/* sheet */
.sheet-wrap{position:absolute;inset:0;z-index:20}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:94%;overflow-y:auto;background:var(--ink-2);border-radius:28px 28px 0 0;padding-block:10px 22px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.2,1);scrollbar-width:none;border-top:1px solid var(--line)}
.sheet::-webkit-scrollbar{display:none}
.sheet-wrap.open .backdrop{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--ink-4);margin:0 auto 10px}
.sheet h2{font-size:19px;font-weight:800;margin:0;flex:1;white-space:nowrap}
.sheet p{color:var(--paper-2);line-height:1.5;margin:0;font-size:14px}

/* toast */
.toast{position:absolute;left:50%;top:56px;transform:translate(-50%,-20px);opacity:0;background:var(--ice);color:var(--ice-ink);box-shadow:0 12px 34px -8px var(--ice-glow);font-weight:700;font-size:13.5px;padding:10px 16px;border-radius:14px;z-index:30;white-space:nowrap;pointer-events:none;transition:opacity .25s, transform .3s cubic-bezier(.2,.9,.2,1);display:flex;gap:8px;align-items:center;max-width:calc(100% - 32px)}
.toast i,.toast svg{width:16px;height:16px;color:var(--ink)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:520px){.toast{top:calc(12px + env(safe-area-inset-top,0px))}}

/* add sheet */
.amount-big{font-size:46px;font-weight:800;text-align:center;letter-spacing:-.02em;font-variant-numeric:tabular-nums;height:62px;line-height:62px;white-space:nowrap;overflow:hidden}
.amount-big .cur{color:var(--dim)}
.caret{display:inline-block;width:2px;height:38px;background:var(--ice);vertical-align:-5px;margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.catgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.cat{display:grid;place-items:center;height:44px;border-radius:13px;background:var(--ink-3);color:var(--paper-2);transition:background .2s,color .2s,transform .15s}
.cat:active{transform:scale(.92)}
.cat[aria-pressed="true"]{background:var(--ice);color:var(--ice-ink)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.key{height:46px;border-radius:13px;background:var(--ink-3);font-size:21px;font-weight:700;display:grid;place-items:center;transition:background .12s, transform .12s}
.key:active{background:var(--ice-soft);color:var(--ice);transform:scale(.96)}
.field{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;background:var(--ink-3);border-radius:14px}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;font-weight:600;font-size:15px}
.field input::placeholder{color:var(--dim)}
.opt{display:flex;align-items:center;gap:10px}
.opt>.lbl{width:64px;flex:none;color:var(--mute);font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
.opt>.lbl i,.opt>.lbl svg{width:15px;height:15px}
.opt .chips{flex:1;min-width:0}

/* tax */
.steps{display:flex;gap:6px;align-items:center}
.steps span{height:5px;width:18px;border-radius:3px;background:var(--ink-4);transition:background .3s,width .3s}
.steps span.on{background:var(--ice);width:30px}
.steps span.done{background:var(--paper-2)}
.q{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:8px 0 2px;white-space:nowrap}
.provgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.prov{height:62px;border-radius:15px;background:var(--ink-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:background .2s, color .2s, transform .15s}
.prov:active{transform:scale(.95)}
.prov b{font-size:17px;font-weight:800;letter-spacing:.02em}
.prov small{font-size:10.5px;color:var(--mute);font-weight:600;white-space:nowrap}
.prov[aria-pressed="true"]{background:var(--ice);color:var(--ice-ink)}
.prov[aria-pressed="true"] small{color:var(--ice-ink);opacity:.75}
.bk{display:flex;align-items:center;gap:10px;height:34px;padding:0 14px;font-size:12.5px;white-space:nowrap}
.bk .rg{width:112px;flex:none;color:var(--paper-2);font-variant-numeric:tabular-nums;font-weight:600}
.bk .bar{flex:1;height:8px;border-radius:4px;background:var(--ink-3);overflow:hidden;min-width:0}
.bk .bar span{display:block;height:100%;background:var(--paper-2);border-radius:4px;transform-origin:left;animation:grow .3s cubic-bezier(.2,.8,.2,1) both}
.bk .rt{width:52px;flex:none;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.bk.you .bar span{background:var(--ice)}
.bk.you .rt,.bk.you .rg{color:var(--ice)}
@keyframes grow{from{transform:scaleX(0)}}
.mfield{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 14px;border-top:1px solid var(--line);white-space:nowrap}
.mfield:first-child{border-top:0}
.mfield label{flex:1;font-weight:600;min-width:0}
.mfield .in{display:flex;align-items:center;gap:2px;width:120px;flex:none;justify-content:flex-end;background:var(--ink-3);border-radius:11px;height:38px;padding:0 10px;transition:box-shadow .2s}
.mfield .in:focus-within{box-shadow:inset 0 0 0 1.5px var(--ice)}
.mfield .in span{color:var(--dim);font-weight:700}
.mfield input{width:100%;background:none;border:0;outline:0;text-align:right;font-weight:800;font-variant-numeric:tabular-nums;font-size:15.5px}
.help{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--ice);background:var(--ice-soft);flex:none}
.help i,.help svg{width:16px;height:16px}
.switch{width:50px;height:30px;border-radius:15px;background:var(--ink-4);position:relative;flex:none;transition:background .25s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:var(--paper);transition:transform .25s cubic-bezier(.2,.9,.2,1)}
.switch[aria-checked="true"]{background:var(--ice)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--ice-ink)}
.hero-num{font-size:40px;font-weight:800;letter-spacing:-.03em;color:var(--ice);font-variant-numeric:tabular-nums;white-space:nowrap}
.kv{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:0 14px;border-top:1px solid var(--line);white-space:nowrap;font-size:14px}
.kv:first-child{border-top:0}
.kv .v{font-weight:800;font-variant-numeric:tabular-nums}
.kv .arrow{color:var(--dim);margin:0 6px}
.tip{display:flex;gap:12px;align-items:flex-start;padding:14px;background:var(--ink-2);border-radius:16px;font-size:13.5px;line-height:1.45;color:var(--paper-2)}
.tip b{color:var(--paper)}
.tip .ic{margin-top:1px}
.legal{font-size:11.5px;line-height:1.5;color:var(--mute);padding:12px 14px;border:1px solid var(--line);border-radius:14px;display:flex;gap:10px}
.legal i,.legal svg{width:16px;height:16px;flex:none;margin-top:1px}
.warn{color:var(--warn)}
.steplist{display:flex;flex-direction:column;gap:0}
.steplist .row{min-height:48px;font-size:14px}
.stepn{width:24px;height:24px;border-radius:8px;background:var(--ice-soft);color:var(--ice);font-size:12px;font-weight:800;display:grid;place-items:center;flex:none}

/* split */
.av{width:30px;height:30px;border-radius:10px;background:var(--ink-4);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--paper);flex:none}
.av.you{background:var(--paper);color:var(--ink)}
.avs{display:flex}
.avs .av{width:24px;height:24px;border-radius:8px;font-size:10.5px;margin-left:-6px;box-shadow:0 0 0 2px var(--ink-2)}
.avs .av:first-child{margin-left:0}
.gcard{background:var(--ink-2);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px;width:100%;text-align:left;transition:transform .15s, background .15s}
.gcard:active{transform:scale(.985);background:var(--ink-3)}
.gtop{display:flex;align-items:center;gap:12px;white-space:nowrap}
.gbot{display:flex;align-items:center;justify-content:space-between;gap:8px;white-space:nowrap}
.mini-act{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--ink-3);color:var(--paper-2);flex:none;transition:background .2s, color .2s, transform .15s}
.mini-act:active{transform:scale(.9)}
.mini-act.ice{background:var(--ice-soft);color:var(--ice)}
.mini-act.done{background:var(--ice);color:var(--ice-ink)}
.mini-act i,.mini-act svg{width:17px;height:17px}
.pulse{animation:pulse .6s ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(168,219,255,.6)}100%{box-shadow:0 0 0 14px rgba(168,219,255,0)}}
.flow{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.flow i,.flow svg{width:14px;height:14px;color:var(--dim)}
.newrow{animation:newrow .9s ease-out}
@keyframes newrow{0%{background:var(--ice-soft)}100%{background:transparent}}
.days{width:36px;text-align:center;flex:none;height:24px;line-height:24px;border-radius:8px;background:var(--ink-3);font-size:11.5px;font-weight:800;color:var(--paper-2);font-variant-numeric:tabular-nums}
.days.soon{background:var(--ice-soft);color:var(--ice)}
.bell{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--dim);flex:none;transition:color .2s, background .2s}
.bell[aria-pressed="true"]{color:var(--ice);background:var(--ice-soft)}
.bell i,.bell svg{width:17px;height:17px}
/* colour + motion layer */
.ic.cc{background:color-mix(in srgb,var(--cc) 22%,transparent);color:var(--cc)}
.cat{color:var(--cc,var(--paper-2))}
.cat[aria-pressed="true"]{box-shadow:0 0 18px -4px var(--ice-glow)}
.rp{position:relative;overflow:hidden}

function calc(code, emp, other, ded, noOhp){

  const ni=Math.max(0,emp+other-ded-cppE-cpp2);
  const claw=Math.min(1,Math.max(0,(ni-FED.b[2])/(FED.b[3]-FED.b[2])));
  const bpa=FED.bpaMax-(FED.bpaMax-FED.bpaMin)*claw;

    if(prev===null){prev=m;continue}
    if(Math.abs(m-prev)>.04){raw.push({from:start,to:x,rate:prev});start=x;prev=m}
  }

  const wide=[];let carry=null;
  raw.forEach(b=>{if(b.to!==Infinity&&b.to-b.from<1500){if(carry===null)carry=b.from;return}
    wide.push({...b,from:carry!==null?carry:b.from});carry=null});

    if(last&&Math.abs(b.rate-last.rate)<.6){if(b.to-b.from>last.to-last.from)last.rate=b.rate;last.to=b.to}
    else out.push(b)});

    add('Pension income amount',Math.min(CR26.pension,pension)*r0,ON?Math.min(CR26.on.pension,pension)*p0:0)}

}

const niceStep=v=>{const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p};
function ssRead(d){
  return `<span class="mute">${MON[d.m]}${d.now?' so far':''}</span><span><b>${fmt2(d.spent)}</b> <span class="mute">spent</span> · <b>${fmt2(Math.abs(d.saved))}</b> <span class="mute">${d.saved<0?'overspent':'saved'}</span></span>`}
function ssChart(){
  if(S.hide)return `<button class="ss-off" data-act="eye" aria-label="Show amounts">${ico('eye-off')}Hidden · tap to show</button>`;
  const D=ssData(),N=D.length;if(V.ssSel==null||V.ssSel>N-1)V.ssSel=N-1;
  const W=340,H=150,L=36,R=4,T=10,B=22,pw=W-L-R,ph=H-T-B;
  const hi=Math.max(1,...D.map(d=>Math.max(d.spent,d.saved))),lo=Math.min(0,...D.map(d=>d.saved));
  const step=niceStep((hi-lo)/3),top=Math.ceil(hi/step)*step,bot=Math.floor(lo/step)*step;
  const y=v=>T+(top-v)/(top-bot)*ph,y0=y(0),slot=pw/N,bw=Math.max(4,Math.min(16,(slot-8)/2));
  const bar=(x,v,c)=>{if(Math.abs(y(v)-y0)<.5)return '';const y1=y(v),h=Math.abs(y1-y0),r=Math.min(4,h,bw/2),sg=y1<y0?1:-1;
    return `<path d="M${x} ${y0}V${y1+sg*r}Q${x} ${y1} ${x+r} ${y1}H${x+bw-r}Q${x+bw} ${y1} ${x+bw} ${y1+sg*r}V${y0}Z" fill="${c}"/>`};
  const ticks=[];for(let v=bot;v<=top+1e-6;v+=step)ticks.push(v);
  let g=ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1" ${v===0?'':'stroke-dasharray="2 4"'}/><text x="${L-6}" y="${y(v)+3.5}" text-anchor="end">${v===0?'0':(v<0?'−':'')+fmtK(Math.abs(v)).replace('$','')}</text>`).join('');
  D.forEach((d,i)=>{const cx=L+slot*i+slot/2,x1=cx-bw-1,x2=cx+1;
    g+=`<g class="ssm${i===V.ssSel?'':' dim'}" data-ss="${i}">${bar(x1,d.spent,SS.spent)}${bar(x2,d.saved,SS.saved)}</g>
      <text x="${cx}" y="${H-6}" text-anchor="middle" class="${d.now?'now':''}">${MON[d.m]}</text>
      <rect data-act="ssm" data-v="${i}" data-ss="${i}" x="${L+slot*i}" y="0" width="${slot}" height="${H}" fill="transparent" style="cursor:pointer"><title>${MON[d.m]}: ${fmt(d.spent)} spent, ${fmt(d.saved)} ${d.saved<0?'overspent':'saved'}</title></rect>`});
  return `<div class="ss-read" id="ssRead">${ssRead(D[V.ssSel])}</div>
  <div class="ss-leg"><span class="lg"><span class="sw" style="background:${SS.spent}"></span>Spent</span><span class="lg"><span class="sw" style="background:${SS.saved}"></span>Saved</span></div>
  <svg class="sssvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Spent and saved, last ${N} months">${g}</svg>
  <table class="sr"><caption>Spent and saved by month</caption><tr><th>Month</th><th>Spent</th><th>Saved</th></tr>${D.map(d=>`<tr><td>${MON[d.m]}</td><td>${fmt(d.spent)}</td><td>${fmt(d.saved)}</td></tr>`).join('')}</table>`;
}
function ssPick(i){if(i===V.ssSel)return;V.ssSel=i;const D=ssData(),r=$('#ssRead');if(r)r.innerHTML=ssRead(D[i]);
  document.querySelectorAll('#screen .ssm').forEach(g=>g.classList.toggle('dim',+g.dataset.ss!==i));fitAll($('#screen'))}

function invStats(a){const put=sum(a.moves,m=>m.amt),l=lastVal(a),val=l?l.v:put;return {put,val,gain:val-put,asOf:l?l.date:null}}

/* split */
function balances(g){const b={};g.members.forEach(m=>b[m]=0);
  g.exp.forEach(e=>{const sh=e.amt/e.among.length;b[e.payer]+=e.amt;e.among.forEach(m=>b[m]-=sh)});
  g.pay.forEach(p=>{b[p.from]+=p.amt;b[p.to]-=p.amt});return b}
function settle(b){const d=[],c=[];Object.entries(b).forEach(([k,v])=>{if(v<-.005)d.push([k,-v]);else if(v>.005)c.push([k,v])});
  d.sort((a,b)=>b[1]-a[1]);c.sort((a,b)=>b[1]-a[1]);const out=[];let i=0,j=0;
  while(i<d.length&&j<c.length){const a=Math.min(d[i][1],c[j][1]);out.push({from:d[i][0],to:c[j][0],amt:Math.round(a*100)/100});d[i][1]-=a;c[j][1]-=a;if(d[i][1]<.005)i++;if(c[j][1]<.005)j++}

    return `${head}
    <div class="q">What do you earn?</div><div class="mute small" style="margin-bottom:12px">Yearly, before tax.</div>
    <div class="list">
      ${mf('salary','briefcase','Salary',t.salary)}${mf('bonus','sparkles','Bonus',t.bonus)}${mf('pt','laptop','Part-time',t.pt)}${mf('other','coins','Other',t.other)}

    </div>
    <div class="sec"><span class="label">Paycheques per year</span><div class="seg">${[[52,'Weekly'],[26,'2 Weeks'],[24,'2×/Mo'],[12,'Monthly']].map(([v,l])=>`<button data-act="freq" data-v="${v}" aria-pressed="${t.freq===v}">${l}</button>`).join('')}</div></div>

      ${mf('target','target','Save / year',t.target)}

    return `${head}
    <div class="q">Your room</div><div class="mute small" style="margin-bottom:12px">Not sure? Tap ${ico('circle-help').replace('<svg','<svg style="width:14px;height:14px;vertical-align:-2px"')} to find it.</div>

    <div class="kv"><span class="mute">Left over</span><span class="v${leftMo<0?' warn':''}">${fmt(leftMo)}</span></div>
  </div></div>
  ${p.short>0?`<div class="tip" style="margin-top:12px"><span class="ic">${ico('triangle-alert')}</span><span><b>Target is ${fmt(p.short)} above what's free.</b> The plan uses ${fmt(p.budget)} so your bills stay covered.</span></div>`:''}

    ${p.fhsa>0?`<div class="tip"><span class="ic ice">${ico('key-round')}</span><span><b>FHSA first.</b> Deductible like an RRSP and tax-free out for a first home.</span></div>`:''}
    ${p.rrsp>0?`<div class="tip"><span class="ic ice">${ico('piggy-bank')}</span><span><b>RRSP while rates are high.</b> Each $1 now saves about ${Math.round(p.mBefore*100)}¢, dropping to ${Math.round(p.mAfter*100)}¢ at the end.</span></div>`:''}
    ${t.bonus>0&&p.rrsp>0?`<div class="tip"><span class="ic ice">${ico('sparkles')}</span><span><b>Bonus straight to RRSP.</b> Ask payroll to send ${fmt(Math.min(t.bonus,p.rrsp))} of it direct. No tax is held back on that part.</span></div>`:''}
    ${p.refund>0?`<div class="tip"><span class="ic ice">${ico('rotate-ccw')}</span><span><b>Reuse the refund.</b> About ${fmt(p.refund)} comes back after you file. Put it in next year's TFSA so it stays easy to reach.</span></div>`:''}
    ${p.tfsa>0?`<div class="tip"><span class="ic ice">${ico('shield')}</span><span><b>TFSA for reachable cash.</b> Grows tax-free and you can take it out any time.</span></div>`:''}
  </div>
  <div class="sec"><div class="legal">${ico('info')}<span>Estimates for education only. This is not tax, legal or financial advice, and Glacio is not a licensed advisor. Rates and room limits change each year. Confirm your numbers with CRA My Account and a qualified professional before you act.</span></div></div>
  <div style="margin-top:14px"><button class="btn ghost" data-act="tstep" data-v="1">${ico('pencil')}Edit numbers</button></div>`;
}
function mf(id,icon,label,val,help){
  return `<div class="mfield"><span class="ic">${ico(icon)}</span><label for="f-${id}">${label}</label>${help?`<button class="help" data-act="help" data-v="${help}" aria-label="How to find ${label}">${ico('circle-help')}</button>`:''}<span class="in"><span>$</span><input id="f-${id}" data-f="${id}" inputmode="numeric" value="${Math.round(val).toLocaleString('en-CA')}"></span></div>`;
}

/* ---------- forecast ---------- */
function taxSeg(){const tabs=[['plan','landmark','Plan'],['fc','trending-up','Forecast'],['ref','rotate-ccw','Refund']].concat(S.biz.on?[['biz','briefcase','Business']]:[]),cur=['fc','ref','biz'].includes(V.tview)&&(V.tview!=='biz'||S.biz.on)?V.tview:'plan';
  return `<div class="seg" style="margin-bottom:14px">${tabs.map(([v,i,l])=>`<button data-act="tview" data-v="${v}" aria-pressed="${cur===v}">${tabs.length<4?ico(i):''}${l}</button>`).join('')}</div>`}
const SAL_MIN=30000,SAL_MAX=300000;
function vForecast(){
  const f=S.fc,p=(f.salary-SAL_MIN)/(SAL_MAX-SAL_MIN)*100;
  return `<div class="top"><h1>Tax</h1><button class="chip ice" data-act="provpick" aria-label="Change province">${ico('map-pin')}${PROV[S.tax.prov].n}${ico('chevron-right')}</button></div>${taxSeg()}
  <div class="mute small">If my salary is</div>
  <div class="hero-num fit" id="fcSal">${fmt(f.salary)}</div>
  <input type="range" class="range" id="fcRange" min="${SAL_MIN}" max="${SAL_MAX}" step="5000" value="${f.salary}" style="--p:${p}%" aria-label="Yearly salary">
  <div id="fcChips" style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px">${[60e3,80e3,100e3,150e3,200e3].map(v=>`<button class="chip${f.salary===v?' on':''}" style="justify-content:center;padding:0" data-act="fcset" data-v="${v}">${fmtK(v)}</button>`).join('')}</div>
  <div class="list" style="margin-top:12px">${mf('monthly','receipt','Costs / month',S.tax.monthly)}</div>
  <div id="fcBody">${fcBody()}</div>`;
}
function fcRooms(sal){return {rrspRoom:Math.min(33810,Math.round(sal*.18)),tfsaRoom:7000}}
function project(sal,f,t){
  const out=[];let rr=0,tf=0,fh=0,fhCum=0,refund=0;
  const target=Math.round(calc(t.prov,sal,0,0).takeHome*f.save/10)*10;
  for(let y=1;y<=10;y++){
    const fhRoom=t.home?Math.max(0,Math.min(8000,40000-fhCum)):0;
    const p=plan({...t,salary:sal,bonus:0,pt:0,other:0,target,...fcRooms(sal),fhsaRoom:fhRoom,home:fhRoom>0});
    const extra=Math.max(0,Math.min(refund,7000-p.tfsa));
    rr=rr*(1+f.ret)+p.rrsp; fh=fh*(1+f.ret)+p.fhsa; tf=tf*(1+f.ret)+p.tfsa+extra;
    fhCum+=p.fhsa; refund=p.refund;
    out.push({y:2026+y,rr,fh,tf,tot:rr+fh+tf});
  }
  return out;
}
let FCP=[];
function niceMax(v){if(v<=0)return 1000;const p=Math.pow(10,Math.floor(Math.log10(v)));return Math.ceil(v/p*2)/2*p}
function topRound(x,y,w,hh,r){r=Math.min(r,hh,w/2);return `M${x} ${y+hh}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+w-r}Q${x+w} ${y} ${x+w} ${y+r}V${y+hh}Z`}
function fcChart(P){
  const W=320,H=180,L=42,R=4,T=10,B=22,pw=W-L-R,ph=H-T-B,max=niceMax(P[P.length-1].tot),n=P.length,slot=pw/n,bw=slot*.58;
  const y=v=>T+ph-(v/max)*ph;
  let g='';
  [0,max/2,max].forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3.5}" text-anchor="end">${fmtK(v)}</text>`});
  P.forEach((d,i)=>{
    const x=L+slot*i+(slot-bw)/2,segs=[[d.rr,SER.rrsp],[d.fh,SER.fhsa],[d.tf,SER.tfsa]].filter(s=>s[0]>0);
    let acc=0,bars='';
    segs.forEach(([v,c],j)=>{const y1=y(acc+v),y0=y(acc)-(j>0?2:0),hh=Math.max(0,y0-y1);acc+=v;
      bars+=j===segs.length-1?`<path d="${topRound(x,y1,bw,hh,4)}" fill="${c}" style="animation-delay:${i*40}ms"/>`:`<rect x="${x}" y="${y1}" width="${bw}" height="${hh}" fill="${c}" style="animation-delay:${i*40}ms"/>`});
    g+=`<g class="fcbar" data-bi="${i}">${bars}</g>`;
    if(i===0||i===4||i===n-1)g+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${d.y}</text>`;
    g+=`<rect data-yr="${i}" data-act="fcyr" data-v="${i}" x="${L+slot*i}" y="${T}" width="${slot}" height="${ph}" fill="transparent" style="cursor:pointer"><title>${d.y}: ${fmt(d.tot)}</title></rect>`;
  });
  return `<svg class="fcsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Projected savings by account, 10 years">${g}</svg>`;
}
function fcReadHTML(){
  const i=V.fcYr==null?FCP.length-1:V.fcYr,d=FCP[i];
  const items=[['RRSP',d.rr,SER.rrsp],['FHSA',d.fh,SER.fhsa],['TFSA',d.tf,SER.tfsa]].filter(s=>s[1]>0);
  return {read:`<span class="label">${d.y} · total</span><span class="big">${fmt(d.tot)}</span>`,
    leg:items.map(([n,v,c])=>`<span class="lg"><span class="sw" style="background:${c}"></span>${n} $${Math.round(v/1000).toLocaleString('en-CA')}K</span>`).join(''),i};
}
function fcReadout(){const r=$('#fcRead');if(!r||!FCP.length)return;const o=fcReadHTML();r.innerHTML=o.read;$('#fcLeg').innerHTML=o.leg;
  document.querySelectorAll('.fcbar').forEach(b=>b.classList.toggle('dim',+b.dataset.bi!==o.i&&V.fcYr!=null))}
function guideRows(){
  const t=S.tax,bk=buckets(t.prov),f=S.fc,list=[50e3,75e3,100e3,125e3,150e3,200e3,250e3];
  const near=list.reduce((a,b)=>Math.abs(b-f.salary)<Math.abs(a-f.salary)?b:a);
  return list.map(s=>{const c=calc(t.prov,s,0,0),m=marginalAt(t.prov,s,0,0),b=bk.find(b=>c.ni>=b.from&&c.ni<b.to);
    const drop=b&&m>=.29?Math.min(Math.ceil((c.ni-b.from+1)/100)*100,fcRooms(s).rrspRoom):0;
    return `<button class="row${s===near?' cur':''}" data-act="fcset" data-v="${s}"><span class="g-s">${fmtK(s)}</span><span class="g-t">${fmt(c.takeHome/12)}</span><span class="g-m">${pct(m)}</span><span class="g-d">${drop?fmt(drop):'TFSA first'}</span></button>`}).join('');
}
function fcBody(){
  const f=S.fc,t=S.tax,sal=f.salary,c=calc(t.prov,sal,0,0),m=marginalAt(t.prov,sal,0,0),takeMo=c.takeHome/12;
  const target=Math.round(c.takeHome*f.save/10)*10;
  const p=plan({...t,salary:sal,bonus:0,pt:0,other:0,target,...fcRooms(sal),fhsaRoom:8000});
  FCP=project(sal,f,t);const rd=fcReadHTML();
  const steps=[['banknote','Cash buffer',t.monthly*3,SER.cash,'3 months'],
    p.fhsa>0&&['key-round','FHSA',p.fhsa,SER.fhsa],p.rrsp>0&&['piggy-bank','RRSP',p.rrsp,SER.rrsp],
    p.tfsa>0&&['shield','TFSA',p.tfsa,SER.tfsa],p.refund>0&&['rotate-ccw','Refund',p.refund,SER.tfsa,'to TFSA']].filter(Boolean);
  return `
  <div class="sec"><span class="label">Take-home</span><div class="list">
    <div class="kv"><span class="mute">Per month</span><span class="v">${fmt(takeMo)}</span></div>
    <div class="kv"><span class="mute">Per pay (${t.freq} a year)</span><span class="v">${fmt(c.takeHome/t.freq)}</span></div>
    <div class="kv"><span class="mute">Tax, CPP, EI / yr</span><span class="v">${fmt(c.tax+c.cpp+c.ei)}</span></div>
    <div class="kv"><span class="mute">Top rate</span><span class="v" style="color:var(--ice)">${pct(m)}</span></div>
    <div class="kv"><span class="mute">Average rate</span><span class="v">${pct(c.tax/sal)}</span></div>
  </div></div>
  <div class="sec"><div class="sec-h"><span class="label">What to do</span><div class="chips">${[.1,.2,.3].map(v=>`<button class="chip${f.save===v?' on':''}" data-act="fcsave" data-v="${v}">${v*100}%</button>`).join('')}</div></div>
    <div class="list">${steps.map((s,i)=>`<div class="row"><span class="stepn">${i+1}</span><span class="ic cc" style="--cc:${s[3]}">${ico(s[0])}</span><span class="grow fit">${s[1]}</span><span class="mute small num">${s[4]||fmt(s[2]/12)+'/mo'}</span><span class="amt">${fmt(s[2])}</span></div>`).join('')}</div>
    <div class="hint">${ico('target')}Saving ${f.save*100}% of take-home: ${fmt(target)}/yr</div>
    ${p.spare<=0?`<div class="tip"><span class="ic">${ico('triangle-alert')}</span><span><b>Costs use all take-home.</b> Your ${fmt(t.monthly)}/mo costs are more than this salary pays.</span></div>`:p.short>0?`<div class="tip"><span class="ic">${ico('triangle-alert')}</span><span><b>Only ${fmt(p.budget)} is free.</b> After your ${fmt(t.monthly)}/mo costs.</span></div>`:''}
  </div>
  <div class="sec"><div class="sec-h"><span class="label">10-year outlook</span><div class="chips">${[.03,.05,.07].map(v=>`<button class="chip${f.ret===v?' on':''}" data-act="fcret" data-v="${v}">${Math.round(v*100)}%/yr</button>`).join('')}</div></div>
    <div class="list" style="padding:14px 12px 8px">
      <div class="fc-read" id="fcRead">${rd.read}</div>
      <div class="fc-leg" id="fcLeg">${rd.leg}</div>
      ${fcChart(FCP)}
    </div>
    <div class="hint">${ico('pointer')}Tap a year · same salary, 2026 rules</div>
  </div>
  <div class="sec"><span class="label">Salary guide · ${PROV[t.prov].s}</span><div class="list">
    <div class="row head"><span class="g-s">Salary</span><span class="g-t">Net / mo</span><span class="g-m">Top</span><span class="g-d">RRSP drop</span></div>
    ${guideRows()}
  </div><div class="hint">${ico('info')}RRSP drop = amount to fall one tax bucket</div></div>
  <div class="sec"><div class="legal">${ico('info')}<span>Projections for education only, not financial advice. Returns are not guaranteed and rules change. Costs are shared with the Plan tab.</span></div></div>`;
}
function fcUpdate(){const f=S.fc,s=$('#fcSal');if(!s)return;s.textContent=fmt(f.salary);
  const r=$('#fcRange');r.value=f.salary;r.style.setProperty('--p',(f.salary-SAL_MIN)/(SAL_MAX-SAL_MIN)*100+'%');
  document.querySelectorAll('#fcChips .chip').forEach(c=>c.classList.toggle('on',+c.dataset.v===f.salary));
  const b=$('#fcBody');b.innerHTML=fcBody();hydrateIcons(b);fitAll($('#screen'))}

const VIEWS={home:vHome,split:vSplit,tax:vTax,bills:vBills};
function render(anim=true){
  const el=$('#screen'); const y=el.scrollTop;
  V.noMask=V.tab==='tax'&&V.tview==='fc';
  document.body.classList.toggle('masked',masked());
  device.classList.toggle('gate',needLogin());
  el.innerHTML=needLogin()?vLogin():VIEWS[V.tab]();
  csBadge();
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-current',b.dataset.v===V.tab?'page':'false'));
  el.scrollTop=anim?0:y
  after(el,anim);placeInd();
}
function after(root,anim){
  try{lucide.createIcons({attrs:{'stroke-width':1.8}})}catch(e){}
  requestAnimationFrame(()=>{
    fitAll(root);if(anim)countUp(root);
  });
}
function fitAll(root){
  root.querySelectorAll('.fit').forEach(el=>{el.style.fontSize='';let fs=parseFloat(getComputedStyle(el).fontSize),n=0;
    while(el.scrollWidth>el.clientWidth&&fs>9&&n<40){fs-=.5;el.style.fontSize=fs+'px';n++}});
}
let toastT;
function toast(msg,icon='check'){const t=$('#toast');t.classList.remove('act');t.innerHTML=ico(icon)+`<span class="fit">${esc(msg)}</span>`;try{lucide.createIcons()}catch(e){}
  t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}

/* ---------- sheets ---------- */
let sheetCtx=null;
function openSheet(html,ctx){const w=$('#sheetWrap'),s=$('#sheet');s.innerHTML=`<div class="grab"></div>`+html;sheetCtx=ctx||null;w.hidden=false;$('.tab-add').classList.add('open');
  requestAnimationFrame(()=>{w.classList.add('open');after(s)});}
function closeSheet(){const w=$('#sheetWrap');w.classList.remove('open');$('.tab-add').classList.remove('open');setTimeout(()=>{w.hidden=true;$('#sheet').innerHTML='';sheetCtx=null},380)}

/* add income / expense */
let A;
function openAdd(){const c=ctxId();A={type:'out',amt:'',cat:'groceries',acct:(S.accts.find(a=>a.id===S.lastAcct)||S.accts[0]||{}).id||'',when:'today',repeat:'Once',remind:'Off',m:'',
  biz:c!=='personal',bizId:c!=='personal'?c:undefined,bcat:'other',slip:'t4a'};drawAdd()}
const BCAT_CAT={meals:'dining',travel:'transport',vehicle:'transport',phone:'bills',rent:'housing',home:'housing',ins:'bills',supplies:'shopping',office:'shopping',equip:'shopping'};
function drawAdd(){
  const cats=A.type==='out'?OUT_CATS:IN_CATS,bz=A.biz&&S.biz.on?bizOf(A.bizId):null;
  const chipset=(name,vals)=>vals.map(v=>`<button class="chip${A[name]===v?' on':''}" data-act="aset" data-k="${name}" data-v="${v}">${v}</button>`).join('');
  const saveLbl=A.edit?'Save changes':bz?`Save to ${bz.n}`:'Save '+CATS[A.cat].n;
  openSheet(`
  <div class="top" style="height:40px"><div class="seg" style="flex:1"><button data-act="atype" data-v="out" aria-pressed="${A.type==='out'}">Expense</button><button data-act="atype" data-v="in" aria-pressed="${A.type==='in'}">Income</button></div><button class="icon-btn" data-act="close" aria-label="Close">${ico('x')}</button></div>
  <div class="addsheet">
    <div class="amtrow"><span></span><div class="amount-big" id="aAmt">${amtHTML()}</div>
      <label class="camb${A.ocr||(A.rc&&A.rc.length)?' on':''}" aria-label="Scan or attach a receipt">${ico('camera')}<input type="file" id="rcFile" accept="image/*" hidden></label></div>
    ${A.ocr||(A.rc&&A.rc.length)?`<div class="rcrow">${(A.rc||[]).map(r=>`<span class="rcth"><img data-rc="${r.id}" ${RCURL[r.id]?`src="${RCURL[r.id]}"`:''} alt="Receipt" ${A.edit&&A.edit.kind==='txn'&&!r.isNew?`data-act="rcview" data-v="${r.id}" data-x="${esc(String(A.edit.id))}"`:''}><button class="x" data-act="rcrm" data-v="${r.id}" aria-label="Remove receipt">${ico('x')}</button></span>`).join('')}${A.ocr?`<span class="chip ice">${ico('camera')}<span id="ocrMsg">${esc(A.ocr)}</span></span>`:''}</div>`:''}
    <div style="display:flex;gap:8px"><div class="field" style="flex:1;min-width:0">${ico('store')}<input id="aName" placeholder="${A.type==='out'?'Where? e.g. Loblaws':'From? e.g. Payroll'}" value="${esc(A.m)}" maxlength="22" autocomplete="off"></div>
      ${bz&&A.type==='out'?`<div class="field" style="width:112px;flex:none;padding:0 10px;gap:4px"><span class="mute small" style="font-weight:800">HST</span><input id="aHst" inputmode="decimal" placeholder="0.00" value="${esc(A.hst||'')}" aria-label="Sales tax paid (optional)"></div>`:''}</div>
    <div class="chips" id="aSug">${sugHTML(A.m)}</div>
    ${bz?(A.type==='out'?`<div class="opt"><span class="lbl">${ico('tag')}CRA</span><div class="chips">${Object.entries(BCAT).map(([k,x])=>`<button class="chip${A.bcat===k?' on':''}" data-act="aset" data-k="bcat" data-v="${k}">${x.s}</button>`).join('')}</div></div>
`
     :`<div class="opt"><span class="lbl">${ico('tag')}Slip</span><div class="chips">${Object.entries(BINC).map(([k,x])=>`<button class="chip${A.slip===k?' on':''}" data-act="aset" data-k="slip" data-v="${k}">${x.s}</button>`).join('')}</div></div>`)
     :`<div class="catgrid" style="grid-template-columns:repeat(${cats.length},1fr)">${cats.map(c=>`<button class="cat" style="--cc:${CATS[c].c}" data-act="acat" data-v="${c}" aria-pressed="${A.cat===c}" aria-label="${CATS[c].n}" title="${CATS[c].n}">${ico(CATS[c].i)}</button>`).join('')}</div>`}
    <div class="opt"><span class="lbl">${ico('wallet')}From</span><div class="chips">${S.accts.map(a=>`<button class="chip${A.acct===a.id?' on':''}" data-act="aset" data-k="acct" data-v="${a.id}">${esc(a.n)}</button>`).join('')}<button class="chip${S.accts.length?'':' ice'}" data-act="acctnew" data-v="add" aria-label="Add account">${ico('plus')}${S.accts.length?'':'Add account'}</button></div></div>
    <div class="opt"><span class="lbl">${ico('calendar')}When</span><div class="chips">${WHEN().map(w=>`<button class="chip${A.when===w.k?' on':''}" data-act="aset" data-k="when" data-v="${w.k}">${w.l}</button>`).join('')}<label class="chip datechip${A.when==='custom'?' on':''}">${ico('calendar')}${A.when==='custom'&&A.date?dayStr(A.date):'Pick date'}<input type="date" id="aDate" value="${A.date||TODAY_ISO}" aria-label="Pick a date"></label></div></div>
    ${A.edit&&S.biz.on&&S.biz.list.length?`<div class="opt"><span class="lbl">${ico('briefcase')}For</span><div class="chips"><button class="chip${A.biz?'':' on'}" data-act="abiz" data-v="0">Personal</button>${S.biz.list.map(b=>`<button class="chip${A.biz&&A.bizId===b.id?' on':''}" data-act="abiz" data-v="${b.id}"><span class="sw" style="background:${b.c}"></span>${esc(b.n)}</button>`).join('')}</div></div>`:''}
    ${A.edit&&A.edit.kind==='txn'?'':`<div class="opt"><span class="lbl">${ico('repeat')}Repeat</span><div class="chips">${chipset('repeat',['Once','Weekly','2 Wks','2×/Mo','Monthly'])}</div></div>`}
    <div class="keypad">${['1','2','3','4','5','6','7','8','9','.','0','del'].map(k=>`<button class="key" data-act="key" data-v="${k}" aria-label="${k==='del'?'Delete':k}">${k==='del'?ico('delete'):k}</button>`).join('')}</div>
    <div class="savebar${A.edit?' two':''}">${A.edit?`<button class="btn ghost" data-act="delitem" data-k="${A.edit.kind}" data-v="${esc(String(A.edit.id))}" aria-label="Delete">${ico('trash')}</button>`:''}<button class="btn" data-act="asave">${ico('check')}${esc(saveLbl)}</button></div>
  </div>`,'add');
  loadThumbs($('#sheet'));
}
function amtHTML(){return `<span class="cur">${A.type==='in'?'+':''}$</span>${A.amt||'0'}<span class="caret"></span>`}
function payees(type){const m=new Map();
  for(const t of S.txns){if(t.type!==type||!t.m)continue;const k=t.m.trim().toLowerCase(),p=m.get(k)||{m:t.m.trim(),n:0,last:''};
    p.n++;if(t.date>=p.last){p.last=t.date;p.cat=t.cat;p.acct=t.acct;p.amt=t.amt}m.set(k,p)}
  return [...m.values()].sort((a,b)=>b.n-a.n||b.last.localeCompare(a.last))}
function sugHTML(q){if(A.edit)return '';q=(q||'').trim().toLowerCase();
  const list=payees(A.type).filter(p=>!q||p.m.toLowerCase().startsWith(q)&&p.m.toLowerCase()!==q).slice(0,6);
  return list.map(p=>`<button class="chip" data-act="asug" data-v="${esc(p.m)}">${CATS[p.cat]?`<span class="sw" style="background:${CATS[p.cat].c}"></span>`:''}${esc(p.m)} · ${fmt2(p.amt)}</button>`).join('')}
function whenDate(){if(A.when==='custom'&&A.date)return fromIso(A.date);return (WHEN().find(x=>x.k===A.when)||WHEN()[0]).d}
function openEdit(kind,id){
  const t=kind==='txn'?S.txns.find(x=>String(x.id)===String(id)):S.sched.find(x=>x.id===id);if(!t)return;
  A={type:t.type,amt:String(+t.amt.toFixed(2)),cat:t.cat,acct:t.acct||'',when:'custom',date:kind==='txn'?t.date:t.next,
     repeat:kind==='txn'?'Once':t.repeat,remind:t.remind||'Off',m:t.m,edit:{kind,id},fresh:true,biz:!!t.biz,bizId:t.bizId,bcat:t.bcat||'other',slip:t.slip||'t4a',hst:t.hst?String(t.hst):'',rc:(t.rc||[]).map(id=>({id})),rcOrig:[...(t.rc||[])]};drawAdd()}
function WHEN(){const n1=new Date(TODAY.getFullYear(),TODAY.getMonth()+1,1);
  return [{k:'today',l:'Today',d:TODAY},{k:'yesterday',l:'Yesterday',d:addDays(TODAY,-1)},{k:'tomorrow',l:'Tomorrow',d:addDays(TODAY,1)},{k:'next1',l:`${MON[n1.getMonth()]} 1`,d:n1}]}
function saveAdd(){
  const amt=parseFloat(A.amt);if(!amt){toast('Enter an amount first','info');return}
  const name=($('#aName')?.value||'').trim()||CATS[A.cat].n;
  syncA();if(A.biz&&A.type==='out'&&!A.edit)A.cat=BCAT_CAT[A.bcat]||'shopping';
  const d=whenDate(), past=d<=TODAY, w={d};
  const bz=S.biz.on&&A.biz?{biz:true,bizId:A.bizId||(S.biz.list[0]||{}).id,bcat:A.type==='out'?(A.bcat||'other'):undefined,slip:A.type==='in'?(A.slip||'t4a'):undefined,hst:A.type==='out'?(parseMoney(A.hst||'')||0):0}:{biz:false,bizId:undefined,bcat:undefined,slip:undefined,hst:0};
  const rcIds=(A.rc||[]).map(r=>r.id);(A.rc||[]).filter(r=>r.isNew).forEach(r=>RDB.put(r.id,r.blob).catch(()=>{}));
  (A.rcOrig||[]).filter(id=>!rcIds.includes(id)).forEach(rcDelete);
  if(rcIds.length&&AUTH)setTimeout(()=>rcSyncPending().catch(()=>{}),800);
  if(A.acct)S.lastAcct=A.acct;
  if(A.edit){
    if(A.edit.kind==='txn'){const t=S.txns.find(x=>String(x.id)===String(A.edit.id));if(t)Object.assign(t,{type:A.type,amt,cat:A.cat,acct:A.acct,m:name,date:iso(d),...bz,rc:rcIds});V.newId=t&&t.id}
    else{const s2=S.sched.find(x=>x.id===A.edit.id);if(s2){Object.assign(s2,{type:A.type,amt,cat:A.cat,acct:A.acct,m:name,next:iso(d),repeat:A.repeat,remind:A.remind,biz:bz.biz,bizId:bz.bizId,bcat:bz.bcat,slip:bz.slip});if(past)rollSched()}}
    save();closeSheet();toast('Changes saved','check');render(false);return}
  if(past){const id=uid();S.txns.push({id,type:A.type,amt,cat:A.cat,acct:A.acct,m:name,date:iso(w.d),w:false,...bz,rc:rcIds});V.newId=id}
  else if(rcIds.length){rcIds.forEach(rcDelete)} // a future payment has no receipt yet
  if(!past||A.repeat!=='Once'){
    const next=past?addRepeat(A.repeat,w.d):w.d;
    S.sched.push({id:'s'+uid(),type:A.type,m:name,amt,cat:A.cat,acct:A.acct,next:iso(next),repeat:A.repeat,remind:A.remind,biz:bz.biz,bizId:bz.bizId,bcat:bz.bcat,slip:bz.slip});
  }
  save();closeSheet();
  toast(past?`${name} ${fmt2(amt)} saved`:`${name} scheduled`, past?'check':'calendar');
  if(V.tab==='home'){V.lvl=0;V.sel=null}render(false);
}

function tbField(k,icon,label,val,ph){return `<div class="mfield"><span class="ic">${ico(icon)}</span><label for="tb-${k}">${label}</label><span class="in"><span>$</span><input id="tb-${k}" data-tb="${k}" inputmode="numeric" placeholder="${ph!=null?Math.round(ph).toLocaleString('en-CA'):'0'}" value="${val!=null&&val!==0?Math.round(val).toLocaleString('en-CA'):''}"></span></div>`}
function tbHero(E){const r=E.refund;
  return `<div class="mute small">${r>=0?'Est. refund':'Est. you owe'} · ${TODAY.getFullYear()} return</div><div class="hero-num fit">${r>=0&&!masked()?'+':''}${fmt(Math.abs(r))}</div>
  <div class="legend" style="margin-top:8px"><div class="leg"><span class="lt">${ico('gift')}Benefits / yr</span><span class="lv fit">${fmt(E.benTotal)}</span></div><div class="leg"><span class="lt">${ico('calendar')}Per month</span><span class="lv fit">${fmt(E.benTotal/12)}</span></div></div>`}
function tbBreak(E){const kv=(k,v,strong)=>`<div class="kv"><span class="mute">${k}</span><span class="v"${strong?' style="color:var(--ice)"':''}>${v}</span></div>`;

   +kv('Federal tax before credits',fmt(E.fedBefore))+kv(`${PROV[S.tax.prov].s} tax before credits`,fmt(E.provBefore))
   +E.items.map(i=>kv(i.n,'−'+fmt(i.f+i.p))).join('')
   +(E.surtax?kv('Ontario surtax',fmt(E.surtax)):'')+(E.lift?kv('Ontario LIFT credit','−'+fmt(E.lift)):'')+(E.ohpAmt?kv('Ontario Health Premium',fmt(E.ohpAmt)):'')
   +kv('Income tax you owe',fmt(E.fed+E.prov))+(E.cppSE?kv('CPP on self-employment',fmt(E.cppSE)):'')

function tbBen(E){const rows=Object.entries(E.ben);

    ${seg('age',[['u65','Under 65'],['65','65–74'],['75','75+']])}${seg('couple',[['false','Single'],['true','Couple']])}${seg('housing',[['rent','Rent'],['own','Own'],['none','Neither']])}</div>

/* ---------- self-employed: CRA T2125 lines ---------- */
const BCAT={adv:{n:'Advertising',s:'Ads',l:'8521'},meals:{n:'Meals & entertainment',s:'Meals',l:'8523',half:true},ins:{n:'Insurance',s:'Insurance',l:'8690'},
  bank:{n:'Interest & bank charges',s:'Bank fees',l:'8710'},lic:{n:'Business taxes, licences, memberships',s:'Licences',l:'8760'},office:{n:'Office expenses',s:'Office',l:'8810'},
  supplies:{n:'Supplies',s:'Supplies',l:'8811'},prof:{n:'Legal, accounting & professional fees',s:'Pro fees',l:'8860'},rent:{n:'Rent',s:'Rent',l:'8910'},
  repair:{n:'Repairs & maintenance',s:'Repairs',l:'8960'},travel:{n:'Travel',s:'Travel',l:'9200'},phone:{n:'Phone, internet & utilities',s:'Phone/net',l:'9220'},
  delivery:{n:'Delivery & shipping',s:'Shipping',l:'9275'},vehicle:{n:'Motor vehicle expenses',s:'Vehicle',l:'9281'},home:{n:'Business-use-of-home',s:'Home office',l:'9945'},
  equip:{n:'Equipment (capital cost allowance)',s:'Equipment',l:'CCA'},other:{n:'Other expenses (software, subscriptions…)',s:'Other',l:'9270'}};
const BINC={t4a:{n:'T4A box 048 · fees for services',s:'T4A 048'},t4ac:{n:'T4A box 020 · commissions',s:'T4A 020'},noslip:{n:'No slip (cash, e-Transfer, sales)',s:'No slip'},other:{n:'Other business income',s:'Other'}};
const bizOf=id=>S.biz.list.find(b=>b.id===id);
const bizRecs=(yr,bid='all')=>S.txns.filter(t=>t.biz&&t.date&&t.date.slice(0,4)===String(yr)&&(bid==='all'||(bid==='none'?!bizOf(t.bizId):t.bizId===bid)));
function bizTot(R){const inc=R.filter(t=>t.type==='in'),exp=R.filter(t=>t.type==='out');
  return {inc,exp,ti:sum(inc,t=>t.amt),te:sum(exp,t=>t.amt),ded:sum(exp,t=>t.amt*(BCAT[t.bcat]&&BCAT[t.bcat].half?.5:1)),hst:sum(exp,t=>t.hst||0)}}
function bizTargets(yr){const L=S.biz.list.map(b=>({id:b.id,n:b.n,bn:b.bn,c:b.c}));if(bizRecs(yr,'none').length)L.push({id:'none',n:'No business picked',bn:'',c:'#717B87'});return L}
function bizSel(yr){const T=bizTargets(yr);if(V.bizSel&&(V.bizSel==='all'||T.some(x=>x.id===V.bizSel)))return V.bizSel;return T.length===1?T[0].id:'all'}
function vBiz(){
  const y0=TODAY.getFullYear(),yr=V.bizYr||y0,T=bizTargets(yr),sel=bizSel(yr),R=bizRecs(yr,sel),X=bizTot(R);
  const cur=T.find(x=>x.id===sel);
  const nrc=sum(X.exp,t=>(t.rc||[]).length),miss=X.exp.filter(t=>!(t.rc||[]).length).length;
  const byE=Object.keys(BCAT).map(k=>{const r=X.exp.filter(t=>(BCAT[t.bcat]?t.bcat:'other')===k);return {k,v:sum(r,t=>t.amt),n:r.length}}).filter(x=>x.n);
  const byI=Object.keys(BINC).map(k=>{const r=X.inc.filter(t=>(BINC[t.slip]?t.slip:'noslip')===k);return {k,v:sum(r,t=>t.amt),n:r.length}}).filter(x=>x.n);

/* our own receipt reader: total, date, store, sales tax */
function parseReceipt(text){
  const lines=text.split(/\n/).map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean);
  const amts=l=>[...l.matchAll(/(?:^|[^\d])\$?\s?(\d{1,3}(?:[ ,]\d{3})*[.,]\s?\d{2}|\d{1,5}[.,]\s?\d{2})(?!\d)/g)].map(m=>{let v=m[1].replace(/\s/g,'');
    if(/,\d{2}$/.test(v)&&!v.includes('.'))v=v.replace(/,(\d{2})$/,'.$1');return parseFloat(v.replace(/,/g,''))}).filter(v=>v>0&&v<100000);
  let total=null,best=-1;
  lines.forEach((l,i)=>{const L=l.toLowerCase();
    if(/sub\s*-?\s*tot|saving|saved|discount|change|tender|cash\s*back|points|rounding/.test(L))return;
    const sc=/grand\s*total|total\s*due|amount\s*due|balance\s*due|montant\s*(total|d[uû])/.test(L)?3:/\btota[l1]\b/.test(L)?2:/\b(amount|montant|debit|visa|mastercard|master|amex|credit|purchase|achat)\b/.test(L)?1:-1;
    if(sc<0)return;let a=amts(l);if(!a.length&&lines[i+1])a=amts(lines[i+1]);if(!a.length)return;const v=a[a.length-1];
    if(sc>best||(sc===best&&v>total)){best=sc;total=v}});
  if(total==null){const all=lines.flatMap(amts);if(all.length)total=Math.max(...all)}
  let hst=0;lines.forEach(l=>{const L=l.toLowerCase();if(/\b(hst|gst|pst|qst|tps|tvq|tax|taxe)\b/.test(L)&&!/total|incl|exempt|#|\bno\b|reg/.test(L)){const a=amts(l);if(a.length){const v=a[a.length-1];if(!total||v<total*.3)hst+=v}}});
  const MO='jan feb mar apr may jun jul aug sep oct nov dec'.split(' ');
  const ok=(y,m,d)=>{if(y<100)y+=2000;const t=new Date(y,m-1,d);if(t.getMonth()!==m-1||t.getDate()!==d||t>addDays(TODAY,1)||t<new Date(TODAY.getFullYear()-2,0,1))return null;return t};
  const pick=(...ds)=>{const v=ds.filter(Boolean).sort((a,b)=>b-a);return v.length?iso(v[0]):null};
  let date=null;for(const l of lines){const L=l.toLowerCase();let m;
    if((m=L.match(/\b(20\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/)))date=pick(ok(+m[1],+m[2],+m[3]));
    else if((m=L.match(/\b(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2}|\d{4})\b/)))date=pick(ok(+m[3],+m[1],+m[2]),ok(+m[3],+m[2],+m[1]));
    else if((m=L.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2}),?\s+(20\d{2}|\d{2})\b/)))date=pick(ok(+m[3],MO.indexOf(m[1])+1,+m[2]));
    else if((m=L.match(/\b(\d{1,2})\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?,?\s+(20\d{2}|\d{2})\b/)))date=pick(ok(+m[3],MO.indexOf(m[2])+1,+m[1]));
    if(date)break}
  const skip=/receipt|welcome|thank|invoice|store\s*#|tel|phone|www|http|@|\d{3}[- ]\d{3}[- ]\d{4}|hst|gst|cashier|transaction|order|date|time/i;
  let merchant='';for(const l of lines.slice(0,6)){const letters=(l.match(/[a-z]/gi)||[]).length;
    if(letters>=3&&letters>=l.replace(/\s/g,'').length*.6&&!skip.test(l)){merchant=l.replace(/[^A-Za-z0-9&'’ .-]/g,'').trim();break}}
  if(merchant===merchant.toUpperCase())merchant=merchant.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
  const known=merchant&&payees('out').find(p=>p.m.toLowerCase().startsWith(merchant.toLowerCase().slice(0,5)));
  return {total,hst:Math.round(hst*100)/100,date,merchant:known?known.m:merchant.slice(0,22),cat:known&&known.cat}}

async function exportData(){
  const name=`glacio-backup-${TODAY_ISO}.json`,body=JSON.stringify({app:'glacio',v:2,at:new Date().toISOString(),data:S},null,1);
  const blob=new Blob([body],{type:'application/json'});
  try{const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Glacio backup'});toast('Backup exported','download');return}}
  catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Backup saved','download');
}
function importData(file){const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result),d=j&&j.data;
      if(!d||!Array.isArray(d.txns))throw 0;
      if(!confirm(`Replace everything on this phone${AUTH?' and in your cloud':''} with the backup from ${String(j.at||'').slice(0,10)||'that file'}?`))return;
      S=d;bindState();save();closeSheet();V.tab='home';V.lvl=0;V.sel=null;V.grp=null;render();toast('Backup restored','upload')}
    catch(e){toast('That file is not a Glacio backup','triangle-alert')}};
  r.readAsText(file)}

const rest=(path,o={})=>sbFetch('/rest/v1/'+path,{auth:true,...o});
const RET={Prefer:'return=representation'};
async function csLoad(){
  if(!AUTH||!navigator.onLine||csBusy)return;csBusy=true;
  try{const [groups,members,exp,pay,notes,prof]=await Promise.all([rest('groups?select=*&order=created_at.asc'),rest('group_members?select=*&order=created_at.asc'),
      rest('expenses?select=*&order=created_at.asc'),rest('payments?select=*&order=created_at.asc'),rest('notifications?select=*&order=created_at.desc&limit=60'),
      rest(`profiles?select=*&id=eq.${AUTH.uid}`)]);
    CS={uid:AUTH.uid,groups:groups||[],members:members||[],exp:exp||[],pay:pay||[],notes:notes||[],me:(prof&&prof[0])||{id:AUTH.uid,email:AUTH.email},at:Date.now()};csErr=null;csSave()}
  catch(e){csErr=e.code==='42P01'||e.code==='PGRST205'?'Shared groups need setup (run supabase/shared.sql)':sbMsg(e)}
  finally{csBusy=false}

const csOn=()=>!!(AUTH&&CS);
const csEmail=()=>(AUTH&&AUTH.email||'').toLowerCase();

const csGroups=()=>CS?CS.groups.filter(g=>csMe(g.id)):[];
const csInvites=()=>CS?CS.members.filter(m=>!m.user_id&&m.email&&m.email.toLowerCase()===csEmail()):[];

const csAv=(gid,id)=>{const m=CS.members.find(x=>x.id===id),n=!m?'?':m.user_id===AUTH.uid?'You':m.name;return `<span class="av${m&&m.user_id===AUTH.uid?' you':''}">${esc(n[0]||'?')}</span>`};
function csBal(gid){const b={};csMembers(gid).forEach(m=>b[m.id]=0);
  CS.exp.filter(e=>e.group_id===gid).forEach(e=>{const sh=+e.amount/e.among.length;b[e.payer]=(b[e.payer]||0)+(+e.amount);e.among.forEach(x=>b[x]=(b[x]||0)-sh)});

    <div class="mute small" style="margin-top:8px;white-space:normal">Share moves a group to the cloud so the people in it can join with their own Glacio.</div></div>`:''}

async function csShareLocal(lid){const lg=S.groups.find(x=>x.id===lid);if(!lg)return;

/* ---------- delete with undo (5 s) ---------- */
let UNDO=null;
function deleteWithUndo(kind,id){
  if(UNDO){clearTimeout(UNDO.t);UNDO.done();UNDO=null}
  const snap=JSON.stringify(S),g=S.groups.find(x=>x.id===V.grp);let rcLater=[],msg='Deleted';
  if(kind==='txn'){const t=S.txns.find(x=>String(x.id)===String(id));rcLater=(t&&t.rc)||[];S.txns=S.txns.filter(x=>x!==t)}
  else if(kind==='sched')S.sched=S.sched.filter(x=>x.id!==id);
  else if(kind==='rem')S.rem=S.rem.filter(x=>x.id!==id);
  else if(kind==='exp'&&g)g.exp.splice(+id,1);
  else if(kind==='pay'&&g){g.pay.splice(+id,1);msg='Payment undone'}
  save();render(false);
  UNDO={snap,done:()=>rcLater.forEach(rcDelete),t:setTimeout(()=>{if(UNDO){UNDO.done();UNDO=null}},5000)};
  const el=$('#toast');el.innerHTML=ico(kind==='pay'?'rotate-ccw':'trash')+`<span class="fit">${msg}</span><button class="undo" data-act="undo">Undo</button>`;
  el.classList.add('show','act');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show','act'),5000)}
function undoDelete(){if(!UNDO)return;clearTimeout(UNDO.t);S=JSON.parse(UNDO.snap);bindState();UNDO=null;save();render(false);toast('Restored','rotate-ccw')}

      b.disabled=true;verifyCode(V.sbEmail,code).then(()=>{V.sbSent=false;if(sheetCtx==='settings')openSettings();render(false);csLoad();toast('Signed in. Sync is on','check')}).catch(err=>{b.disabled=false;if(AUTH&&AUTH.uid){AUTH.lastErr=sbMsg(err);saveAuth();openSettings()}toast(sbMsg(err),'triangle-alert')});break}
    case 'sbback': V.sbSent=false;if(sheetCtx==='settings')openSettings();else render(false);break;
    case 'sbsync': syncNow(AUTH&&AUTH.dirty?'push':'pull');toast('Syncing…','rotate-ccw');break;
    case 'sbout': if(AUTH&&confirm('Sign out of cloud sync? Your data stays on this phone.')){const tok=AUTH.access_token;
      fetch(SB.url+'/auth/v1/logout',{method:'POST',headers:{apikey:SB.key,Authorization:'Bearer '+tok}}).catch(()=>{});AUTH=null;saveAuth();CS=null;csSave();V.cg=null;clearTimeout(pushT);closeSheet();render();toast('Signed out','info')}break;
    case 'acctnew': if(v==='add'&&$('#aName'))A.m=$('#aName').value; openAcctNew(v);break;
    case 'ackind': AC.kind=v;AC.sub=ACCT_KIND[v].subs?Object.keys(ACCT_KIND[v].subs)[0]:undefined;drawAcctNew();break;
    case 'acsub': AC.sub=v;drawAcctNew();break;
    case 'ctx': S.ctx=v;save();V.lvl=0;V.sel=null;V.ssSel=null;render(false);break;
    case 'acsave': saveAcct();break;
    case 'acback': drawAdd();break;
    case 'acdel':{const a=S.accts.find(x=>x.id===v);if(a&&confirm(`Remove ${a.n}? Its records stay, marked "No account".`)){S.accts=S.accts.filter(x=>x!==a);save();openSettings();render(false)}break}
    case 'invnew': openInvNew();break;
    case 'ivkind': IV.kind=v;drawInvNew();break;
    case 'ivsave': saveInvNew();break;
    case 'inv': openInv(v);break;
    case 'ivmode': openInv(v,b.dataset.k);break;
    case 'ivdo': invDo(v,b.dataset.k);break;
    case 'ivdel':{const a=S.inv.find(x=>x.id===v);if(a&&confirm(`Delete ${a.n} and its history?`)){S.inv=S.inv.filter(x=>x!==a);save();closeSheet();render(false);toast('Account deleted','trash')}break}
    case 'eye': S.hide=!S.hide;save();render(false);toast(S.hide?'Amounts hidden':'Amounts shown',S.hide?'eye-off':'eye');break;
    case 'ssm': ssPick(+v);break;
    case 'export': exportData();break;
    case 'import': $('#importFile').click();break;
    case 'wipe': if(confirm(AUTH?'Erase all Glacio data on this phone? You will be signed out; your cloud copy stays.':'Erase all Glacio data on this phone? Export a backup first if you want to keep it.')){if(AUTH){AUTH=null;saveAuth();clearTimeout(pushT)}S=DEFAULT();bindState();save();closeSheet();V.tab='home';V.lvl=0;V.sel=null;V.grp=null;render();toast('All data erased','trash')}break;
    case 'txn': openEdit('txn',v);break;
    case 'remopen': openEditRem(v);break;
    case 'schedopen': openEdit('sched',v);break;
    case 'grprep': b.setAttribute('aria-checked',b.getAttribute('aria-checked')!=='true');break;
    case 'gsave': saveGrp();break;
    case 'delgrp':{const g=S.groups.find(x=>x.id===v);if(g&&confirm(`Delete ${g.n}?`)){S.groups=S.groups.filter(x=>x!==g);save();V.grp=null;render();toast('Group deleted','trash')}break}
    case 'grp': V.grp=v;render();break;
    case 'newgrp': openNewGrp();break;
    case 'nudge':{const k=b.dataset.g+b.dataset.f+b.dataset.t,g=S.groups.find(x=>x.id===b.dataset.g);V.nudged[k]=1;b.classList.add('pulse');
      const msg=`Hi ${PEOPLE[b.dataset.f]}, quick reminder: you owe ${fmt2(+b.dataset.a)} for ${g.n}.`;
      if(navigator.share){navigator.share({text:msg}).catch(()=>{})}else{try{navigator.clipboard.writeText(msg);toast('Reminder copied','bell-ring')}catch(e){}}
      setTimeout(()=>render(false),250);break}
    case 'paid':{const g=S.groups.find(x=>x.id===b.dataset.g);g.pay.push({from:b.dataset.f,to:b.dataset.t,amt:parseFloat(b.dataset.a)});save();render(false);toast(`${PEOPLE[b.dataset.f]} marked as paid`,'circle-check');break}
    case 'addexp': openAddExp();break;
    case 'epay': E.payer=v;drawExp();break;
    case 'eamong': {if(E.among.includes(v)){if(E.among.length>1)E.among=E.among.filter(x=>x!==v)}else E.among.push(v);drawExp();break}
    case 'esave':{const amt=parseMoney($('#eAmt').value);if(!amt){toast('Enter the total','info');return}
      const g=S.groups.find(x=>x.id===V.grp),l=$('#eName').value.trim()||'Shared cost';
      if(E.idx!=null&&g.exp[E.idx]){Object.assign(g.exp[E.idx],{l,amt,payer:E.payer,among:[...E.among]});save();closeSheet();render(false);toast('Changes saved','check');break}
      g.exp.push({l,i:'receipt',amt,payer:E.payer,among:[...E.among]});save();closeSheet();render(false);toast(`${l} split ${E.among.length} ways`,'split');break}
    case 'remtog':{const r=S.rem.find(x=>x.id===v);r.on=!r.on;save();render(false);toast(r.on?`Alert ${r.lead} day${r.lead>1?'s':''} before ${r.n}`:`${r.n} alert off`,r.on?'bell-ring':'bell-off');break}
    case 'addrem': openAddRem();break;
    case 'rkind': R.kind=v;b.parentElement.querySelectorAll('.cat').forEach(c=>c.setAttribute('aria-pressed',c===b));break;
    case 'rlead': R.lead=+v;b.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));break;
    case 'rsave':{const n=$('#rName').value.trim(),amt=parseMoney($('#rAmt').value),day=Math.min(31,Math.max(1,parseInt($('#rDay').value)||0));
      if(!n||!day){toast('Add a name and due day','info');return}
      if(R.editId){const r=S.rem.find(x=>x.id===R.editId);if(r)Object.assign(r,{kind:R.kind,n,amt,day,lead:R.lead});save();closeSheet();render(false);toast('Changes saved','check');break}
      S.rem.push({id:'r'+Date.now(),kind:R.kind,n,amt,day,lead:R.lead,on:true});save();closeSheet();render(false);toast(`${n} reminder set`,'bell-ring');break}
    case 'atype': A.type=v;A.cat=v==='out'?'groceries':'salary';A.m=$('#aName').value;drawAdd();break;
    case 'acat': A.cat=v;b.parentElement.querySelectorAll('.cat').forEach(c=>c.setAttribute('aria-pressed',c===b));$('[data-act="asave"]').innerHTML=ico('check')+(A.edit?'Save changes':A.biz&&bizOf(A.bizId)?'Save to '+esc(bizOf(A.bizId).n):'Save '+CATS[v].n);try{lucide.createIcons()}catch(e){};break;
    case 'aset': A[b.dataset.k]=v;b.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));break;
    case 'key':{let s=A.amt;if(A.fresh){A.fresh=false;if(v!=='del')s=''}if(v==='del')s=s.slice(0,-1);else if(v==='.'){if(!s.includes('.'))s=(s||'0')+'.'}else{if(s.includes('.')&&s.split('.')[1].length>=2)break;if(s.replace('.','').length>=7)break;s=(s==='0'?'':s)+v}
      A.amt=s;$('#aAmt').innerHTML=amtHTML();break}
    case 'asave': saveAdd();break;
    case 'tstep': syncTax(); t.step=+v;save();render();break;
    case 'prov': t.prov=v;save();render(false);break;
    case 'freq': t.freq=+v;save();b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));break;
    case 'usetracked': t.monthly=+v;save();$('#f-monthly').value=(+v).toLocaleString('en-CA');toast('Costs set from your tracking','wand-sparkles');break;
    case 'home': syncTax(); t.home=!t.home;save();render(false);break;
    case 'mode': t.mode=v;save();b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
      $('#modeNote').textContent=v==='bal'?'Top bracket to RRSP, then TFSA, then more RRSP.':'RRSP first while each $1 saves about 30¢ or more.';break;
    case 'help': openHelp(v);break;
    case 'tview': syncTax(); V.tview=v; V.fcYr=null; render(); break;
    case 'fcset': S.fc.salary=+v; V.fcYr=null; save(); fcUpdate(); $('#screen').scrollTo({top:0,behavior:'smooth'}); break;
    case 'fcsave': S.fc.save=+v; save(); fcUpdate(); break;
    case 'fcret': S.fc.ret=+v; save(); fcUpdate(); break;
    case 'fcyr': V.fcYr=+v; fcReadout(); break;
    case 'userrsp':{const v2=Math.round(Math.min(33810,parseMoney($('#f-lastEarn').value)*.18));t.rrspRoom=v2;save();closeSheet();const f=$('#f-rrspRoom');if(f)f.value=v2.toLocaleString('en-CA');toast(`RRSP room set to ${fmt(v2)}`,'piggy-bank');break}
  }
});
function closeIf(){if(!$('#sheetWrap').hidden)closeSheet()}
function syncTax(){document.querySelectorAll('#screen [data-f]').forEach(i=>{S.tax[i.dataset.f]=parseMoney(i.value)})}
device.addEventListener('change',e=>{if(e.target.id==='importFile'&&e.target.files[0])importData(e.target.files[0]);
  if(e.target.id==='rcFile'&&e.target.files[0]){const f=e.target.files[0];e.target.value='';addReceipt(f).catch(()=>{A.ocr=null;if(sheetCtx==='add')drawAdd();toast("Couldn't use that photo",'triangle-alert')})}
  if(e.target.id==='aDate'&&e.target.value){A.m=$('#aName')?.value||A.m;A.when='custom';A.date=e.target.value;drawAdd()}});
device.addEventListener('input',e=>{
  const i=e.target;
  if(i.dataset.tb){const raw=i.value.replace(/[^0-9]/g,'').slice(0,8),k=i.dataset.tb;i.value=raw?parseInt(raw).toLocaleString('en-CA'):'';
    S.tb[k]=raw?parseInt(raw):(k==='withheld'||k==='rrsp'?null:0);save();tbRefresh();return}
  if(i.id==='aName'){A.m=i.value;const sg=$('#aSug');if(sg){sg.innerHTML=sugHTML(i.value);hydrateIcons(sg)}
    const p=payees(A.type).find(x=>x.m.toLowerCase()===i.value.trim().toLowerCase());
    if(p&&!A.edit&&CATS[p.cat]&&p.cat!==A.cat){A.cat=p.cat;document.querySelectorAll('#sheet .cat').forEach(c=>c.setAttribute('aria-pressed',c.dataset.v===p.cat));$('[data-act="asave"]').innerHTML=ico('check')+'Save '+CATS[p.cat].n}return}
  if(i.id==='cityPick'){const p=CITY[i.value.trim().toLowerCase()];S.tax.city=i.value;save();
    if(p&&p!==S.tax.prov){S.tax.prov=p;save();render(false);document.querySelectorAll('#sheet .prov').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===p));toast(`${i.value.trim()} uses ${PROV[p].n} rates`,'map-pin')}return}
  if(i.id==='fcRange'){S.fc.salary=+i.value;V.fcYr=null;save();fcUpdate();return}
  if(i.id==='city'){const p=CITY[i.value.trim().toLowerCase()];S.tax.city=i.value;if(p&&p!==S.tax.prov){S.tax.prov=p;save();render(false);toast(`${i.value.trim()} uses ${PROV[p].n} rates`,'map-pin');const c=$('#city');c.focus();c.setSelectionRange(c.value.length,c.value.length)}return}
  if(i.dataset.f){
    const raw=i.value.replace(/[^0-9]/g,'').slice(0,8);const n=raw?parseInt(raw):0;i.value=raw?n.toLocaleString('en-CA'):'';
    if(i.dataset.f==='lastEarn'){$('#rrspEst').textContent=fmt(Math.min(33810,n*.18));return}
    S.tax[i.dataset.f]=n;save();
    if(V.tab==='tax'&&V.tview==='fc'){fcUpdate();return}
    const g=$('#grossOut');if(g)g.textContent=fmt(S.tax.salary+S.tax.bonus+S.tax.pt+S.tax.other);
  }
  if(i.id==='eAmt'||i.id==='eName'){}
});

/* donut: tap to select, hold to open */
let holdT=null,holdEl=null,held=false;
device.addEventListener('pointerdown',e=>{
  const arc=e.target.closest('.arc');if(!arc)return;held=false;
  if(arc.dataset.hold){holdEl=arc;arc.classList.add('holding');arc.closest('.donut').classList.add('holding');
    holdT=setTimeout(()=>{held=true;try{navigator.vibrate&&navigator.vibrate(12)}catch(_){};V.type=arc.dataset.k;V.lvl=1;V.sel=null;render()},480)}
});
const cancelHold=()=>{clearTimeout(holdT);if(holdEl)holdEl.classList.remove('holding');document.querySelectorAll('.donut.holding').forEach(d=>d.classList.remove('holding'));holdEl=null};
device.addEventListener('pointerup',e=>{
  const arc=e.target.closest('.arc');const wasHold=held;cancelHold();if(!arc||wasHold)return;
  const k=arc.dataset.k;
  if(V.tab==='home'&&V.lvl===0){V.sel=V.sel===k?null:k;selectSlice()}
  else if(V.tab==='home'&&V.lvl===1){V.acct=k;V.lvl=2;render()}
});
device.addEventListener('pointerleave',cancelHold);device.addEventListener('pointercancel',cancelHold);
function selectSlice(){
  const tx=monthTx(),inc=sum(tx.filter(t=>t.type==='in'),t=>t.amt),out=sum(tx.filter(t=>t.type==='out'),t=>t.amt),net=inc-out,s=V.sel;
  document.querySelectorAll('#screen .arc').forEach(a=>a.classList.toggle('sel',a.dataset.k===s));
  document.querySelectorAll('#screen .leg').forEach(l=>l.classList.toggle('sel',l.dataset.v===s));
  document.querySelector('#screen .donut').classList.toggle('has-sel',!!s);
  const v=s==='in'?inc:s==='out'?out:null;
  document.querySelector('#screen .dc-sub').textContent=v===null?'Net':(s==='in'?'Income':'Expense');
  $('#dcMain').textContent=v===null?(S.hide?'':net>=0?'+':'')+fmt2(net):fmt2(v);
  $('#dcFoot').textContent=v===null?`${fmt2(inc)} in`:pct(v/(inc+out||1),0)+' of flow';
  fitAll($('#screen'));
}
window.addEventListener('resize',()=>{fitAll(document);placeInd()});
function placeInd(){const a=document.querySelector('.tab[aria-current="page"]'),ind=$('#tabInd');if(a&&ind)ind.style.transform='translateX('+(a.offsetLeft+a.offsetWidth/2-20)+'px)'}
function countUp(root){root.querySelectorAll('.dc-main,.hero-num').forEach(el=>{const m=el.textContent.match(/^([+−-]?)\$([\d,]+)(\.\d+)?$/);if(!m)return;
  const pre=m[1],n=parseFloat(m[2].replace(/,/g,'')+(m[3]||'')),d=m[3]?m[3].length-1:0,fin=el.textContent,t0=performance.now();
  const step=now=>{const k=Math.min(1,(now-t0)/300),e=1-Math.pow(1-k,3);el.textContent=k<1?pre+fmt(n*e,d):fin;if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}
/* swipe a row left to show Delete */
const SW={el:null,x0:0,y0:0,dx:0,base:0,on:false,block:false};
const swRow=s=>s.querySelector('.swrow');
function swClose(except){document.querySelectorAll('.swipe.open').forEach(x=>{if(x!==except){x.classList.remove('open');swRow(x).style.transform=''}})}
function swStart(target,x,y){SW.block=false;const s=target.closest('.swipe');
  if(!s){if(document.querySelector('.swipe.open')&&!target.closest('.swdel')){swClose();SW.block=true}return}
  if(target.closest('.swdel'))return;SW.el=s;SW.x0=x;SW.y0=y;SW.dx=0;SW.on=false;SW.base=s.classList.contains('open')?-76:0}
function swMove(x,y,ev){if(!SW.el)return;const dx=x-SW.x0,dy=y-SW.y0;
  if(!SW.on){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.2){SW.on=true;swClose(SW.el);SW.el.classList.add('dragging')}else{if(Math.abs(dy)>10)SW.el=null;return}}
  if(ev&&ev.cancelable)ev.preventDefault();
  SW.dx=Math.max(-120,Math.min(0,SW.base+dx));swRow(SW.el).style.transform=`translateX(${SW.dx}px)`}
function swEnd(){if(!SW.el)return;const s=SW.el;SW.el=null;s.classList.remove('dragging');
  if(!SW.on){if(s.classList.contains('open')){SW.block=true;swClose()}return}
  SW.block=true;const open=SW.dx<-38;s.classList.toggle('open',open);swRow(s).style.transform=open?'translateX(-76px)':''}
// fingers: touch events (we stop the page scrolling only once the move is clearly sideways)
device.addEventListener('touchstart',e=>{if(e.touches.length===1)swStart(e.target,e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
device.addEventListener('touchmove',e=>{if(e.touches.length===1)swMove(e.touches[0].clientX,e.touches[0].clientY,e)},{passive:false});
device.addEventListener('touchend',swEnd);device.addEventListener('touchcancel',swEnd);
// mouse / trackpad
device.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')swStart(e.target,e.clientX,e.clientY)});
device.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')swMove(e.clientX,e.clientY)});
device.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')swEnd()});
device.addEventListener('pointerover',e=>{const m=e.target.closest('[data-ss]');if(m)ssPick(+m.dataset.ss)});
device.addEventListener('pointerover',e=>{const b=e.target.closest('[data-yr]');if(b&&+b.dataset.yr!==V.fcYr){V.fcYr=+b.dataset.yr;fcReadout()}});

['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
render();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;if(iso(new Date())!==TODAY_ISO){location.reload();return}syncNow('pull')});
window.addEventListener('online',()=>syncNow(AUTH&&AUTH.dirty?'push':'pull'));
setInterval(()=>{if(AUTH&&document.visibilityState==='visible')csLoad()},60000);
syncNow('pull');
</script>
